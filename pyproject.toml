[project]
name = "relink-reference-lab"
version = "0.1.0"
description = "RELink physical reference lab for Raspberry Pi Pico 2 W"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
