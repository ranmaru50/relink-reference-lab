# .github/workflows/quality.yml
# PHP/JavaScript/Python の標準テストと静的解析、Shell の構文検証を CI で実行する。

name: quality

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer static-analysis

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint

  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: bash -n scripts/setup-linux.sh
      - run: shellcheck scripts/setup-linux.sh

  linux-bootstrap:
    needs: python-and-shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Place the checkout in the production-like path
        run: |
          sudo install -d -m 0755 /opt/relink
          sudo cp -a "$GITHUB_WORKSPACE" /opt/relink/relink-reference-lab
      - name: Run the native bootstrap
        run: |
          cd /opt/relink/relink-reference-lab
          sudo ./scripts/setup-linux.sh \
            --resolver-host resolver.relink.test \
            --lab-host lab.relink.test
      - name: Verify an idempotent rerun
        run: |
          cd /opt/relink/relink-reference-lab
          sudo ./scripts/setup-linux.sh \
            --resolver-host resolver.relink.test \
            --lab-host lab.relink.test
